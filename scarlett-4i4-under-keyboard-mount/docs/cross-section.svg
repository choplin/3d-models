<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="700" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#111">Cross-section across the stand arm</text>
  <text x="20" y="50" font-size="12" fill="#666">Looking along the arm, i.e. from the front. Dimensions in mm.</text>

  <!-- keyboard -->
  <rect x="30" y="61.9" width="760" height="34" fill="#dedede" stroke="#999"/>
  <text x="44" y="84" font-size="12" fill="#555">keyboard</text>

  <!-- strap loop, drawn before the arm so the arm sits over it -->
  <path d="M264,232.9 L264,109.9 L396,109.9 L396,232.9" fill="none" stroke="#e08020"
        stroke-width="6" stroke-linejoin="round"/>
  <path d="M264,232.9 L396,232.9" fill="none" stroke="#e08020" stroke-width="6"/>

  <!-- stand arm, seated on the groove floor -->
  <rect x="285" y="112.9" width="90" height="105" fill="#8a8a8a" stroke="#555"/>
  <text x="330" y="158" font-size="12" fill="#fff" text-anchor="middle">arm</text>
  <text x="330" y="174" font-size="11" fill="#eee" text-anchor="middle">30 wide</text>

  <g fill="#2f7d7d" stroke="#1f5555" stroke-width="1">
    <!-- ceiling band, with the locating groove and the relief channel in its floor -->
    <path d="M244.5,229.9 L244.5,202.9 L283.5,202.9 L283.5,217.9 L309,217.9 L309,222.4
             L351,222.4 L351,217.9 L376.5,217.9 L376.5,202.9 L415.5,202.9 L415.5,229.9 Z"/>
    <!-- ceiling skin: this section falls in the windows, so only these strips remain -->
    <rect x="46.2"  y="202.9" width="36" height="9.6"/>
    <rect x="208.5" y="202.9" width="36" height="9.6"/>
    <rect x="415.5" y="202.9" width="36" height="9.6"/>
    <rect x="577.8" y="202.9" width="36" height="9.6"/>
    <!-- side walls -->
    <rect x="46.2"  y="202.9" width="12" height="227.1"/>
    <rect x="601.8" y="202.9" width="12" height="227.1"/>
    <!-- floor -->
    <rect x="46.2"  y="420.4" width="567.6" height="9.6"/>
  </g>

  <!-- strap slots through the band -->
  <rect x="259.5" y="202.9" width="9" height="27" fill="#ffffff" stroke="#1f5555" stroke-width="1"/>
  <rect x="391.5" y="202.9" width="9" height="27" fill="#ffffff" stroke="#1f5555" stroke-width="1"/>

  <!-- device -->
  <rect x="58.2" y="243.4" width="543.6" height="177" fill="#3d6fb4" fill-opacity="0.4" stroke="#2b5488"/>
  <text x="330" y="330" font-size="14" fill="#1c3a63" text-anchor="middle">Scarlett 4i4   180 x 129 x 59</text>
  <text x="330" y="350" font-size="11" fill="#33557f" text-anchor="middle">placeholders, not yet measured</text>

  <g font-size="12">
    <!-- short callouts only; the reasoning is in the notes below -->
    <line x1="216" y1="152" x2="284" y2="210" stroke="#1f5555" stroke-width="1.2"/>
    <text x="212" y="148" fill="#1f5555" text-anchor="end">groove 5 deep, + rubber strip</text>

    <line x1="216" y1="176" x2="306" y2="221" stroke="#666" stroke-width="1.2"/>
    <text x="212" y="172" fill="#666" text-anchor="end">relief channel</text>

    <line x1="468" y1="124" x2="402" y2="112" stroke="#e08020" stroke-width="1.2"/>
    <text x="474" y="120" fill="#a85c10" font-weight="bold">2 straps round the arm</text>
    <text x="474" y="136" fill="#a85c10">they carry the whole load</text>

    <line x1="514" y1="196" x2="514" y2="208" stroke="#666" stroke-width="1.2"/>
    <text x="514" y="190" fill="#555" text-anchor="middle">ceiling window</text>

    <!-- drop below the arm -->
    <line x1="620" y1="217.9" x2="690" y2="217.9" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="620" y1="430"   x2="690" y2="430"   stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="666" y1="217.9" x2="666" y2="430" stroke="#555" stroke-width="1.2"
          marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="678" y="318" fill="#111" font-weight="bold">70.7</text>
    <text x="678" y="334" fill="#666">drop below</text>
    <text x="678" y="348" fill="#666">the arm</text>

    <!-- overall width -->
    <line x1="46.2" y1="455" x2="613.8" y2="455" stroke="#555" stroke-width="1.2"
          marker-start="url(#ar)" marker-end="url(#ar)"/>
    <text x="330" y="474" fill="#333" text-anchor="middle">189.2</text>
  </g>

  <g font-size="12.5" fill="#333">
    <text x="20" y="516" font-weight="bold" fill="#111">Notes</text>
    <text x="20" y="540">The straps carry the whole load. Nothing sits on top of the arm except the strap,</text>
    <text x="20" y="558">and placed clear of the arm's rubber pad the keyboard is not lifted at all.</text>
    <text x="20" y="582">The groove locates the arm sideways and holds a 1.5 mm rubber strip. That strip is</text>
    <text x="20" y="600">what resists the mount creeping along the arm as cables are plugged and unplugged,</text>
    <text x="20" y="618">since those forces run parallel to the arm and the groove walls cannot bear on them.</text>
    <text x="20" y="642">The relief channel clears a hook socket's raised rim on the arm's underside.</text>
    <text x="20" y="666">Front and rear are open and the unit slides in from the front over a 3 mm lip. The top</text>
    <text x="20" y="684">panel is not reachable once mounted, which is inherent to mounting under a keyboard.</text>
  </g>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 10 2 L 5 5 L 10 8 z" fill="#555"/>
    </marker>
  </defs>
</svg>
